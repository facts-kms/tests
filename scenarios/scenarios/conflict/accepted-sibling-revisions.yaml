version: 1
name: accepted-sibling-revisions
seed: 4001
clock:
  start: 2026-01-05T09:00:00Z
characters:
  - name: alice
    environments: [replica_a, replica_b]
ledgers:
  - name: operations
steps:
  - grant:
      ledger: operations
      actor: alice
      capabilities: [propose, accept, deliberate]
  - propose:
      actor: alice
      replica: replica_a
      ledger: operations
      as: policy
      markdown: |
        # Conflict policy

        Last undisputed version.
  - accept:
      actor: alice
      replica: replica_a
      proposition: policy
  - assert:
      - status:
          proposition: policy
          equals: accepted
      - effective_revision:
          proposition: policy
          equals: policy
  - sync:
      from: replica_a
      to: replica_b
      ledger: operations
  - parallel:
      branches:
        - replica: replica_a
          steps:
            - revise:
                actor: alice
                proposition: policy
                as: policy_a
                markdown: |
                  # Conflict policy

                  Branch A.
            - accept:
                actor: alice
                proposition: policy
        - replica: replica_b
          steps:
            - revise:
                actor: alice
                proposition: policy
                as: policy_b
                markdown: |
                  # Conflict policy

                  Branch B.
            - accept:
                actor: alice
                proposition: policy
  - sync:
      from: replica_a
      to: replica_b
      ledger: operations
  - sync:
      from: replica_b
      to: replica_a
      ledger: operations
  - assert:
      - status:
          proposition: policy
          equals: conflict
      - effective_revision:
          proposition: policy
          equals: policy
      - conflict:
          proposition: policy
          conflict_type: accepted-sibling-revisions
          branch_tips: [policy_a, policy_b]
          last_undisputed_ancestor: policy
          reconciliation_required: true
          no_arbitrary_winner: true
