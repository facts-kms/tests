name: Facts Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    env:
      FACT_SOURCE_DIR: ../sdk
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: fact-tests
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/sdk
          path: sdk
      - name: Trust checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fact-tests"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sdk"
      - name: Run lint
        working-directory: fact-tests
        run: ./run deploy phase lint

  test:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - lint
    env:
      FACT_SOURCE_DIR: ../sdk
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: fact-tests
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/sdk
          path: sdk
      - name: Checkout CLI repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/cli
          path: cli
      - name: Trust checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fact-tests"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sdk"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/cli"
      - name: Run test
        working-directory: fact-tests
        run: ./run deploy phase test

  build:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-build-')
    env:
      FACT_SOURCE_DIR: ../sdk
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: fact-tests
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/sdk
          path: sdk
      - name: Trust checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fact-tests"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sdk"
      - name: Run build
        working-directory: fact-tests
        run: ./run deploy phase build

  release:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-release-')
    env:
      FACT_SOURCE_DIR: ../sdk
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: fact-tests
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/sdk
          path: sdk
      - name: Trust checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fact-tests"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sdk"
      - name: Run release
        working-directory: fact-tests
        run: ./run deploy phase release

  deploy:
    runs-on: ubuntu-latest
    container: rust:1.86-bookworm
    needs:
      - test
    if: contains(github.ref_name, '-deploy-')
    env:
      FACT_SOURCE_DIR: ../sdk
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version
          cargo --version
          rustup component add rustfmt clippy
          cargo fmt --version
          cargo clippy --version
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: fact-tests
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: facts-kms/sdk
          path: sdk
      - name: Trust checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fact-tests"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/sdk"
      - name: Run deploy
        working-directory: fact-tests
        run: ./run deploy phase deploy
